
name: Check Matt Upstream

on:
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Compare revisions
        id: check
        shell: bash
        run: |
          set -euo pipefail

          PINNED=$(git -C upstream/mattpocock-skills rev-parse HEAD)
          LATEST=$(git ls-remote \
            https://github.com/mattpocock/skills.git \
            refs/heads/main | awk '{print $1}')

          test -n "$LATEST"

          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

          if [[ "$PINNED" != "$LATEST" ]]; then
            echo "outdated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update issue
        if: steps.check.outputs.outdated == 'true'
        uses: actions/github-script@v7
        env:
          PINNED: ${{ steps.check.outputs.pinned }}
          LATEST: ${{ steps.check.outputs.latest }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pinned = process.env.PINNED;
            const latest = process.env.LATEST;
            const marker = '<!-- matt-upstream-watch -->';

            const body = [
              marker,
              'Matt Pocock Skills 有新版本，待人工評估。',
              '',
              `Pinned: \`${pinned}\``,
              `Latest: \`${latest}\``,
              '',
              `[Compare changes](https://github.com/mattpocock/skills/compare/${pinned}...${latest})`,
              '',
              '### Review checklist',
              '- [ ] 檢查 Matt upstream 變更',
              '- [ ] 評估 local design / review / challenge Skills',
              '- [ ] 檢查 instructions/common.md',
              '- [ ] 決定是否升級 upstream pin',
              '- [ ] 升級後執行測試與 verify'
            ].join('\n');

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: 'all', per_page: 100 }
            );

            const tracked = issues.filter(
              i => !i.pull_request && i.body?.includes(marker)
            );

            const open = tracked.find(i => i.state === 'open');

            if (open) {
              if (open.body.includes(`Latest: \`${latest}\``)) {
                return;
              }

              await github.rest.issues.update({
                owner, repo,
                issue_number: open.number,
                body
              });

              await github.rest.issues.createComment({
                owner, repo,
                issue_number: open.number,
                body: `Matt upstream 更新至 \`${latest}\``
              });

              return;
            }

            const acknowledged = tracked.some(
              i => i.state === 'closed' &&
                   i.body?.includes(`Latest: \`${latest}\``)
            );

            if (!acknowledged) {
              await github.rest.issues.create({
                owner, repo,
                title: 'Review Matt upstream updates',
                body
              });
            }
