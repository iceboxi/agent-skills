interface:
  display_name: "Technical Design Review"
  short_description: "Challenge technical designs against repository evidence"
  default_prompt: "使用 $review 對既有 Design Doc（含 implementation / migration sections）做獨立 evidence-based review，查核核心設計、工時與依 scope 適用的 planning，指出 blocking findings 並給 acceptance verdict；ACCEPT 類型預設建立該版本與 review scope 的 accepted baseline。"
policy:
  allow_implicit_invocation: true
