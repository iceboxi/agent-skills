interface:
  display_name: "Technical Design Review"
  short_description: "Challenge technical designs against repository evidence"
  default_prompt: "使用 $review 對既有 technical design 做獨立 evidence-based review，查核 ownership、重大假設與 go/no-go、migration / delivery 可行性、工時依據及成果驗收，指出 blocking findings 並給 acceptance verdict，不代替 design。"
policy:
  allow_implicit_invocation: true
