interface:
  display_name: "Design Doc"
  short_description: "Publish a standalone architecture Design Doc from decided specs and plans"
  default_prompt: "使用 $design 讀取已確認的 grill-with-docs 決策、to-spec 規格與 to-tickets 工作內容，整理成獨立完整、固定章節的 Markdown Design Doc。包含 Current/Target architecture、protocol/function placement 與 code sketches、state ownership、runtime/sequence、migration phases、工時與驗證；工作分組以工程 phase 呈現，不曝光任何 ticket 資訊，也不重新做架構決策。"
policy:
  allow_implicit_invocation: false
