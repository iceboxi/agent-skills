interface:
  display_name: "Design"
  short_description: "Design implementable architecture from repository evidence"
  default_prompt: "使用 $design 根據需求與 repository evidence 完成 software design，主動 explore / 提問，產出含 architecture、protocol、runtime flow、migration、phases、工時與驗證的 Markdown Design Doc；依 scope 與風險展開 feasibility gates、delivery planning 與 outcome metrics。"
policy:
  allow_implicit_invocation: true
